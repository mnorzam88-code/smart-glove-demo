<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Protective Glove: alert logic demo</title>
<meta name="description" content="Concept demo of the Smart Protective Glove alert logic, on simulated data.">
<style>
:root{--bg:#f6f3e8;--card:#fff;--ink:#1f3a5f;--mute:#5b6b80;--heat:#e8833a;--sense:#3a86c8;--ok:#2e9e6b;--bad:#c0392b;--line:#d9d4c3}
@media (prefers-color-scheme:dark){:root{--bg:#13202f;--card:#1b2d42;--ink:#f1ede0;--mute:#a9b7c8;--line:#35495f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Tahoma,Verdana,sans-serif;line-height:1.6}
main{max-width:860px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.2;margin:0 0 8px}
p{margin:0 0 12px}.mute{color:var(--mute);font-size:.92rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:16px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
button[aria-pressed="true"],button.go{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sense);outline-offset:2px}
input[type=range]{flex:1;min-width:160px;accent-color:var(--heat)}
svg{width:100%;height:auto;display:block}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:12px}
.chip{border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:.9rem;color:var(--mute);transition:.2s}
.chip.on{border-color:var(--heat);color:var(--ink);background:rgba(232,131,58,.15)}
.verdict{font-weight:700;margin:12px 0 0}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0}.bar .l{width:160px;font-size:.9rem;flex:none}
.track{flex:1;background:var(--line);border-radius:8px;height:28px;overflow:hidden}
.fill{height:100%;width:0;transition:width .5s;color:#fff;font-size:.85rem;padding:4px 8px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.fill,.chip{transition:none}}
@media (max-width:480px){.bar{flex-wrap:wrap}.bar .l{width:100%}}
</style></head><body><main>
<header><div><h1 data-k="title"></h1></div><button id="lang" aria-label="Language">العربية</button></header>
<p data-k="intro"></p>
<p class="mute" data-k="disc"></p>

<div class="card">
<div class="row" id="sc" role="group">
<button data-s="stable" aria-pressed="true" data-k="s1"></button>
<button data-s="dip" aria-pressed="false" data-k="s2"></button>
<button data-s="drift" aria-pressed="false" data-k="s3"></button></div>
<div class="row" style="margin-top:12px"><label for="nz" data-k="noise"></label><input id="nz" type="range" min="0.1" max="0.7" step="0.1" value="0.3"><b id="nzv">0.3°C</b></div>
<div class="row" style="margin-top:12px"><button class="go" id="one" data-k="run1"></button><button id="many" data-k="run300"></button></div>
</div>

<div class="card">
<svg id="ch" viewBox="0 0 720 220" role="img"></svg>
<p class="mute" data-k="cap"></p>
<div class="chips">
<div class="chip" data-i="A"><b>A</b> <span data-k="cA"></span></div>
<div class="chip" data-i="B"><b>B</b> <span data-k="cB"></span></div>
<div class="chip" data-i="C"><b>C</b> <span data-k="cC"></span></div></div>
<p class="verdict" id="vd" aria-live="polite"></p>
</div>

<div class="card"><b data-k="rates"></b>
<div class="bar"><span class="l" data-k="r1"></span><div class="track"><div class="fill" id="f1" style="background:var(--bad)"></div></div></div>
<div class="bar"><span class="l" data-k="r2"></span><div class="track"><div class="fill" id="f2" style="background:var(--ok)"></div></div></div>
<p class="mute" data-k="note"></p></div>
<p class="mute" data-k="foot"></p>
</main>
<script>
const T={
en:{title:"Try the glove’s alert logic",intro:"Pick a situation, set the sensor noise, and see when the glove would alert if it needed one indicator versus two.",
disc:"Concept demo on simulated data. It uses the project’s indicator rules (A, B, C) in a simplified form, so the numbers will not match the full Python analysis. Thresholds are preliminary, not clinical. Not a medical tool.",
s1:"Stable fingers",s2:"Brief temperature dip",s3:"Slow drift + missed responses",noise:"Sensor noise (SD)",run1:"Run one 6-hour session",run300:"Run 300 times",
cap:"Index fingertip, simulated. The dashed line is the personal baseline.",cA:"≥1.0°C from baseline for 10 readings",cB:"range above 2.0°C within 11 readings",cC:"3 missed vibration responses in a row",
rates:"Alert rate across 300 runs",r1:"1 indicator is enough",r2:"2 indicators needed",note:"Press “Run 300 times”. For stable and brief-dip cases lower is better; for the drift case higher is better.",
foot:"Smart Protective Glove · early-warning aid, not a diagnostic tool · clinical accuracy has not been established.",
none:"No indicator active. Neither rule alerts.",act:(n,two)=>`${n} indicator${n>1?"s":""} active. One-indicator rule: ALERT. Two-indicator rule: ${two?"ALERT":"no alert"}.`,btn:"العربية",h:"h",aria:"Simulated index fingertip temperature over six hours"},
ar:{title:"جرّب منطق التنبيه في القفاز",intro:"اختر حالة، وحدّد مستوى ضجيج المستشعر، وشاهد متى سينبّه القفاز لو اكتفى بمؤشر واحد مقابل مؤشرين.",
disc:"عرض تجريبي للفكرة على بيانات محاكاة. يستخدم قواعد المؤشرات (A وB وC) بشكل مبسّط، لذلك لن تطابق أرقامه تحليل Python الكامل. العتبات أولية وليست سريرية. وهو ليس أداة طبية.",
s1:"أصابع مستقرة",s2:"هبوط حرارة مؤقت",s3:"انجراف بطيء مع عدم استجابة",noise:"ضجيج المستشعر (الانحراف المعياري)",run1:"تشغيل جلسة واحدة (6 ساعات)",run300:"تشغيل 300 مرة",
cap:"حرارة طرف السبابة (محاكاة). الخط المتقطع هو خط الأساس الشخصي.",cA:"انحراف ≥1.0°م عن خط الأساس لـ10 قراءات",cB:"مدى يتجاوز 2.0°م خلال 11 قراءة",cC:"3 حالات عدم استجابة متتالية للاهتزاز",
rates:"معدل التنبيه خلال 300 تشغيل",r1:"يكفي مؤشر واحد",r2:"يلزم مؤشران",note:"اضغط «تشغيل 300 مرة». في حالتي المستقر والهبوط المؤقت الأقل أفضل، وفي حالة الانجراف الأعلى أفضل.",
foot:"القفاز الذكي الواقي · أداة إنذار مبكر وليست أداة تشخيص · لم تثبت الدقة السريرية بعد.",
none:"لا يوجد مؤشر نشط. لا تنبّه أي من القاعدتين.",act:(n,two)=>`${n} مؤشر نشط. قاعدة المؤشر الواحد: تنبيه. قاعدة المؤشرين: ${two?"تنبيه":"لا تنبيه"}.`,btn:"English",h:"س",aria:"محاكاة حرارة طرف السبابة خلال ست ساعات"}};
let L="en",sc="stable",last=null;const N=720,NOM=[33.05,32.8,32.61],$=id=>document.getElementById(id);
const g=()=>{let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random())};
function gen(s,sd){const ch=NOM.map(n=>Array.from({length:N},()=>n+sd*g()));
 if(s==="dip")ch.forEach(c=>{for(let i=200;i<204;i++)c[i]-=3});
 if(s==="drift")ch.forEach(c=>{for(let i=200;i<N;i++)c[i]-=2.5*(i-200)/(N-200)});
 const miss=Array.from({length:6},(_,i)=>s==="drift"&&i>=2?true:Math.random()<.1);
 const base=ch.map(c=>c.slice(0,10).reduce((a,b)=>a+b)/10);let A=false,B=false,C=false;
 ch.forEach((c,k)=>{let run=0;for(let i=0;i<N;i++){run=Math.abs(c[i]-base[k])>=1?run+1:0;if(run>=10)A=true}
  for(let i=0;i+11<=N&&!B;i++){let mx=-1e9,mn=1e9;for(let j=i;j<i+11;j++){mx=Math.max(mx,c[j]);mn=Math.min(mn,c[j])}if(mx-mn>2)B=true}});
 let r=0;miss.forEach(m=>{r=m?r+1:0;if(r>=3)C=true});return{ch0:ch[0],b0:base[0],A,B,C}}
function draw(r){last=r;const y=v=>200-(v-29.5)*(180/5.5),x=i=>10+i*700/N;
 const p=r.ch0.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join("");let t="";
 for(let h=0;h<=6;h++)t+=`<text x="${x(h*120)}" y="216" font-size="11" fill="currentColor" text-anchor="middle">${h}${T[L].h}</text>`;
 $("ch").innerHTML=`<line x1="10" x2="710" y1="${y(r.b0)}" y2="${y(r.b0)}" stroke="#3a86c8" stroke-dasharray="6 5"/><path d="${p}" fill="none" stroke="#e8833a" stroke-width="1.5"/>${t}`;
 document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",r[c.dataset.i]));
 const n=r.A+r.B+r.C;$("vd").textContent=n?T[L].act(n,n>1):T[L].none}
const sd=()=>+$("nz").value;
const one=()=>draw(gen(sc,sd()));
function many(){let a=0,b=0;for(let k=0;k<300;k++){const r=gen(sc,sd()),n=r.A+r.B+r.C;if(n>=1)a++;if(n>=2)b++}
 [["f1",a],["f2",b]].forEach(([id,v])=>{const e=$(id),p=v/3;e.style.width=Math.max(p,6)+"%";e.textContent=p.toFixed(1)+"%"})}
function setLang(l){L=l;const d=document.documentElement;d.lang=l;d.dir=l==="ar"?"rtl":"ltr";
 document.querySelectorAll("[data-k]").forEach(e=>e.textContent=T[l][e.dataset.k]);
 $("lang").textContent=T[l].btn;$("ch").setAttribute("aria-label",T[l].aria);document.title=T[l].title;if(last)draw(last)}
$("lang").onclick=()=>setLang(L==="en"?"ar":"en");
$("nz").oninput=()=>{$("nzv").textContent=sd().toFixed(1)+"°C"};
document.querySelectorAll("#sc button").forEach(b=>b.onclick=()=>{sc=b.dataset.s;document.querySelectorAll("#sc button").forEach(x=>x.setAttribute("aria-pressed",x===b));one()});
$("one").onclick=one;$("many").onclick=many;setLang("en");one();
</script></body></html>
